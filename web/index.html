function helpModal(){const links=String(store.workspace.customLinks||'').split('\n').map(line=>{let [name,url]=line.split('|').map(s=>s.trim());try{if(!/^https?:$/.test(new URL(url).protocol))return '';return `<a class="row-line" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon('external','sm')}${esc(name||url)}</a>`}catch(e){return ''}}).join('');modal('Dein Start mit LANGKAS',`<div class="feature-band" style="margin-bottom:20px"><div><h3>Ein Arbeitsplatz. Viele Möglichkeiten.</h3><p>Diese unabhängige Demo speichert alles lokal in deinem Browser.</p></div></div>${[['Chat starten','Schreibe eine Nachricht, hänge eine Textdatei an und bearbeite die Antwort.','new-chat','chat'],['Einen Agenten bauen','Definiere Aufgabe, Anweisungen und Wissen für einen wiederverwendbaren Assistenten.','agent-create','agents'],['Workflow testen','Verbinde Schritte und bestätige eine Freigabe.','workflow-open','workflow']].map(([t,d,a,ic],i)=>`<button class="search-result" data-action="${a}" ${i===2?'data-id="w1"':''}>${icon(ic)}<span class="grow"><strong>${t}</strong><p style="white-space:normal;line-height:1.6">${d}</p></span>${icon('chevron','sm')}</button>`).join('')}<h3 style="margin:24px 0 10px">Tastenkürzel</h3><div class="row-line between"><span>Workspace durchsuchen</span><kbd>⌘ / Ctrl K</kbd></div><div class="row-line between"><span>Neuer Chat</span><kbd>⌘ / Ctrl ⇧ O</kbd></div><div class="row-line between"><span>Nachricht senden</span><kbd>Enter</kbd></div><div class="row-line between"><span>Zeilenumbruch</span><kbd>Shift Enter</kbd></div><div class="row-line between"><span>Dialog schließen</span><kbd>Esc</kbd></div>${links?'<h3 style="margin-top:24px">Workspace-Links</h3>'+links:''}`,btn('Über diese Demo','about','info')+btn('Loslegen','modal-close','','primary'),true)}
function aboutModal(){modal('Über diese Demo',`<div class="flex" style="margin-bottom:23px">${brand(true)}<div><h2 style="font-size:21px">LANGKAS · KI, oba koa Kas.</h2><p class="muted small" style="margin-top:5px">KI, oba koa Kas. · eine HTML-Datei · Version 3</p></div></div>${callout('LANGKAS ist eine unabhängige lokale Demo mit augenzwinkerndem Österreich-Branding. Funktionsstruktur und Bedienmuster orientieren sich an öffentlich zugänglichen KI-Workspace-Produkten.','info')}<h3 style="margin:23px 0 10px">Was tatsächlich lokal funktioniert</h3><p style="font-size:12px;line-height:1.9">Chats anlegen, bearbeiten und exportieren; Favoriten und Projekte; Text- und Bilduploads; CSV-Berechnungen; Dateisuche; Prompt-Variablen; Agenten-Konfiguration und Versionen; Skills; sequenzielle Workflow-Tests mit Freigabe und Dokumentausgabe; Einstellungen; Datenexport und Import.</p><h3 style="margin:23px 0 10px">Was eine Vorschau bleibt</h3><p style="font-size:12px;line-height:1.9">Modellantworten ohne eigenen API-Endpunkt, Websuche, Deep Research, Bildgenerierung, OAuth-Integrationen, echte Teamfreigaben, Anmeldung, SSO/SCIM, Abrechnung und automatische Zeitpläne. PDF- und Office-Dateien haben nur Metadaten. Keine Sicherheitszertifizierung oder Compliance-Zusage.</p><h3 style="margin:23px 0 10px">Optionaler API-Modus</h3><p style="font-size:12px">Ein eigener kompatibler Chat-Endpunkt kann ausdrücklich aktiviert werden. Nur dieser erhält dann Chatinhalte; API-Schlüssel werden nicht gespeichert. CORS-Freigabe erforderlich.</p><h3 style="margin:23px 0 10px">Öffentliche Referenzen</h3><div style="font-size:11px;line-height:2"><a href="https://langdock.com/de" target="_blank" rel="noopener noreferrer">Langdock · Referenzprodukt</a><br><a href="https://docs.langdock.com/en/using-langdock/chat/functionalities" target="_blank" rel="noopener noreferrer">Chat-Funktionen</a><br><a href="https://docs.langdock.com/en/using-langdock/account/account" target="_blank" rel="noopener noreferrer">Konto-Einstellungen</a><br><a href="https://docs.langdock.com/en/admin/workspace/workspace" target="_blank" rel="noopener noreferrer">Workspace-Einstellungen</a><br><a href="https://docs.langdock.com/en/using-langdock/workflows/workflow-builder" target="_blank" rel="noopener noreferrer">Workflow-Builder</a></div>`,btn('Selbsttest','self-test','check')+btn('Verstanden','modal-close','','primary'),true)}
function selfTest(){const checks=[];let test=(name,fn)=>{try{fn();checks.push({name,ok:true})}catch(e){checks.push({name,ok:false,error:e.message})}};test('Datenstruktur & IDs',()=>validateImport(store));test('JSON-Roundtrip',()=>{const c=JSON.parse(JSON.stringify(store));if(c.chats.length!==store.chats.length)throw Error('Chats stimmen nicht überein')});test('HTML-Escaping',()=>{if(esc('<script>')!=='&lt;script&gt;')throw Error('Escaping fehlgeschlagen')});test('CSV mit Anführungszeichen',()=>{const r=csvRows('Name;Wert\n"A;B";12');if(r[1][0]!=='A;B')throw Error('CSV-Parserfehler')});test('Lokale Berechnung',()=>{const r=demoAnswer('Daten analysieren',[{id:'test',kind:'text',name:'x.csv',text:'Monat;Umsatz\nJänner;10\nFebruar;20'}]);if(!r.text.includes('30'))throw Error('Falsche Summe')});test('API-Schlüssel nicht in Sicherung',()=>{if('endpoint'in store)throw Error('API-Konfiguration wird gespeichert')});test('Projekt-Referenzen',()=>{if(store.chats.some(c=>c.project&&!store.projects.some(p=>p.id===c.project)))throw Error('Ungültige Referenz')});test('Keine externen Start-Ressourcen',()=>{if(document.querySelector('script[src],link[rel=stylesheet][href^="http"],img[src^="http"]'))throw Error('Externe Ressource vorhanden')});test('Aktives Modell vorhanden',()=>{if(!Models.some(m=>m.id===store.prefs.defaultModel))throw Error('Modell fehlt')});test('Workflow-Schritte gültig',()=>{if(store.workflows.some(w=>w.nodes.some(n=>!NodeTypes[n.type])))throw Error('Unbekannter Typ')});modal('Lokaler Selbsttest',`<p class="muted" style="font-size:12px;margin-bottom:17px">${checks.filter(x=>x.ok).length} von ${checks.length} Prüfungen bestanden. Diese Prüfungen sind kein vollständiger Browser-E2E-Nachweis.</p>${checks.map(c=>`<div class="test-result ${c.ok?'test-pass':'test-fail'}">${icon(c.ok?'check':'close','sm')}<span>${esc(c.name)}${c.error?' · '+esc(c.error):''}</span></div>`).join('')}`,btn('Schließen','modal-close','','primary'));return checks}

function watchRun(r,replay=false){
 if(live.streams.has(r.id))return;
 if((live.events.get(r.id)||[]).some(e=>e.type==='done'))return;
 live.runs.set(r.id,r);const logs=live.events.get(r.id)||[];live.events.set(r.id,logs);
 const last=logs.at(-1)?.seq||0;
 if(!last){r.output=''} // The durable event stream rebuilds output exactly once, including after reload.
 const stream=new EventSource('/api/runs/'+encodeURIComponent(r.id)+'/events?since='+last);live.streams.set(r.id,stream);
 const receive=type=>event=>{let data;try{data=JSON.parse(event.data)}catch{return}const seq=Number(event.lastEventId);if(logs.some(e=>e.seq===seq))return;logs.push({seq,type,data});
  if(type==='delta')r.output+=data.text||'';
  if(type==='status')Object.assign(r,data);
  if(type==='done'){Object.assign(r,data);stream.close();live.streams.delete(r.id);updateBusy();refreshState().catch(showFailure)}
  if(type==='status'&&data.status==='awaiting_approval'){
   if(ui.view==='runs'&&ui.id===r.id)updateRunDetail(r.id);
   toast('Lauf wartet auf deine Freigabe. Öffne „Läufe“.');
  }
  paintRun(r);
 };
 for(const t of ['status','delta','process','tool','log','stderr','session','step','artifact','done'])stream.addEventListener(t,receive(t));
 stream.onerror=()=>{if(finished.has(r.status)&&logs.some(e=>e.type==='done')){stream.close();live.streams.delete(r.id)}else{const el=$('#syncStatus');if(el)el.textContent='Verbindung wird wiederhergestellt …'}};
}
async function loadRuns(){const data=await request('/api/runs');for(const r of data.runs){if(!live.streams.has(r.id))live.runs.set(r.id,r)}for(const r of data.runs.filter(r=>!finished.has(r.status)).slice(0,2))watchRun(live.runs.get(r.id));updateBusy()}

async function submitRun(payload,destination='chat'){
 await flushState();const r=await request('/api/runs','POST',payload,{'Idempotency-Key':uid('request')});live.runs.set(r.id,r);await refreshState(false);
 ui.draft='';ui.attachments=[];ui.agent=payload.agent||null;ui.project=payload.project||null;if(live.runners.some(x=>x.id===r.provider))ui.model=r.provider;
 if(destination==='runs')navigate('runs',r.id);else navigate('chat',r.chat_id);
 watchRun(r);updateBusy();render();return r;
}

async function liveBoot(){
 if(location.protocol==='file:'){authScreen('Starte das Backend mit „python3 -m langcas serve --open“. Diese Live-Oberfläche benötigt localhost.');return}
 try{const data=await request('/api/bootstrap');store=data.state;live.base=clone(store);live.rev=data.revision;live.runners=data.runners;live.workspaces=data.workspaces;live.ready=true;live.dirty=false;live.blocked=false;updateModels();ui.model=store.prefs.defaultModel||'auto';$('#authGate')?.remove();$('#main').inert=false;$('#sidebar').inert=false;await loadRuns();route();if(!live.runners.some(r=>r.available&&r.enabled))toast('Noch keine CLI installiert oder aktiviert. Öffne „CLI-Runner“.');}
 catch(e){authScreen(e.status===401?'':e.message)}
}
liveBoot();

</script>
</body>
</html>
