function avatar(name,cls='',photo=''){if(photo&&/^data:image\/(png|jpeg|webp);base64,/.test(photo))return `<img class="avatar ${cls}" src="${esc(photo)}" alt="Profilbild">`;return `<span class="avatar ${cls}">${esc(String(name).split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase())}</span>`}
function toast(text,error=false,undo=false){const host=$('#toasts');for(const old of [...host.children])if(old.dataset.text===text)old.remove();while(host.children.length>=3)host.firstElementChild.remove();const el=document.createElement('div');el.className='toast';el.dataset.text=text;el.setAttribute('role',error?'alert':'status');el.innerHTML=icon(error?'info':'check','sm')+`<span>${esc(text)}</span>`+(undo?'<button data-action="undo">Rückgängig</button>':'');host.append(el);setTimeout(()=>el.remove(),undo?6500:error?5000:3200)}
async function copy(text){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}else{const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.opacity='0';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw Error('clipboard')}toast('In die Zwischenablage kopiert.')}catch(e){modal('Text kopieren',`<p class="muted" style="margin-bottom:14px">Der Browser blockiert die Zwischenablage. Markiere den Text und kopiere ihn manuell.</p><textarea class="input" style="min-height:160px" readonly>${esc(text)}</textarea>`,btn('Schließen','modal-close'));}}
function download(name,content,type='text/plain;charset=utf-8'){const blob=content instanceof Blob?content:new Blob([content],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name.replace(/[<>:"/\\|?*\x00-\x1F]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function applyTheme(){const t=store.prefs.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):store.prefs.theme;document.body.dataset.theme=t;document.body.classList.toggle('compact',!!store.prefs.compact);document.body.classList.toggle('reduce-motion',!store.prefs.motion);document.documentElement.style.setProperty('--accent',store.workspace.accent);document.body.classList.toggle('collapsed',ui.collapsed);document.body.classList.toggle('mobile-open',ui.mobile)}
function navigate(view='chat',id=''){closePopover();closeModal();ui.mobile=false;ui.tab='all';ui.filter='Alle';ui.folder=null;ui.canvas=false;ui.flowNode=null;const target=view+(id?'/'+encodeURIComponent(id):'');if(location.hash.slice(1)===target)route();else location.hash=target}

function newChat(agent=null,project=null){ui.draft='';ui.attachments=[];ui.agent=agent;ui.project=project;ui.model=agent?(store.agents.find(x=>x.id===agent)?.model||store.prefs.defaultModel):store.prefs.defaultModel;ui.tools={web:false,research:false,knowledge:false};navigate('chat');setTimeout(()=>$('#composerInput')?.focus(),100)}
function render(){applyTheme();renderSidebar();renderHeader();const view=$('#view');view.innerHTML=renderView();if(ui.view==='chat'){restoreComposer();if(ui.id)scrollChat();}if(ui.view==='workflow')refreshFlow();document.title=(ui.view==='chat'&&ui.id?store.chats.find(c=>c.id===ui.id)?.title:Titles[ui.view]||'LANGKAS')+' · LANGKAS'}
const Titles={chat:'Chat',agents:'Agenten','agent-edit':'Agent bearbeiten',workflows:'Workflows',workflow:'Workflow',library:'Bibliothek',projects:'Projekte',project:'Projekt',prompts:'Prompt-Bibliothek',integrations:'Integrationen',skills:'Skills',tasks:'Geplante Aufgaben',settings:'Einstellungen'};

function renderSidebar(){const chats=store.chats.filter(c=>!c.archived).sort((a,b)=>b.updated-a.updated);const rows=cs=>cs.map(c=>`<div class="side-chat ${ui.id===c.id?'active':''}"><button data-action="open-chat" data-id="${c.id}" title="${esc(c.title)}">${esc(c.title)}</button>${ib('dots','chat-menu','Chat verwalten',`data-id="${c.id}"`)}</div>`).join('');$('#sidebar').innerHTML=`<div class="brand-row"><button class="flex grow" data-action="new-chat" aria-label="LANGKAS Startseite">${brand()}<span class="brand-word">LANGKAS</span></button>${ib('panel','sidebar-toggle','Seitenleiste einklappen')}</div><button class="workspace-name" data-action="workspace-menu"><span class="workspace-glyph">${esc(store.workspace.name.slice(0,2).toUpperCase())}</span><span class="truncate grow" style="font-size:11px;font-weight:520">${esc(store.workspace.name)}</span>${icon('down','sm')}</button><button class="btn new-chat" data-action="new-chat">${icon('edit','sm')}Neuer Chat<kbd>⇧ ⌘ O</kbd></button><button class="nav-item" data-action="search">${icon('search')}Chats durchsuchen<kbd>⌘ K</kbd></button>${navRow('agents','Agenten','agents')}${navRow('workflows','Workflows','workflow')}${navRow('library','Bibliothek','library')}${navRow('prompts','Prompt-Bibliothek','book')}${navRow('integrations','Integrationen','integrations')}${navRow('skills','Skills','bolt')}
<div class="sidebar-scroll"><div class="side-section"><button data-action="nav" data-view="projects" style="padding:0;color:inherit;font-size:inherit">Projekte</button>${ib('plus','project-create','Projekt erstellen')}</div>${store.projects.map(p=>`<button class="nav-item ${ui.view==='project'&&ui.id===p.id?'active':''}" data-action="open-project" data-id="${p.id}" style="font-size:11px">${icon('folder','sm')}<span class="truncate">${esc(p.name)}</span></button>`).join('')}
${chats.some(c=>c.pinned)?`<div class="side-section" style="margin-top:18px"><span>Favoriten</span>${icon('star','sm')}</div>${rows(chats.filter(c=>c.pinned))}`:''}<div class="side-section" style="margin-top:15px"><span>Heute</span></div>${rows(chats.filter(c=>!c.pinned&&Date.now()-c.updated<86400000))||'<p class="muted small" style="padding:4px 9px">Noch keine Chats</p>'}${chats.some(c=>!c.pinned&&Date.now()-c.updated>=86400000)?`<div class="side-section"><span>Letzte 7 Tage</span></div>${rows(chats.filter(c=>!c.pinned&&Date.now()-c.updated>=86400000).slice(0,15))}`:''}</div>
<div class="sidebar-bottom"><button class="nav-item" data-action="nav" data-view="tasks">${icon('clock')}Geplante Aufgaben</button><button class="nav-item" data-action="help">${icon('help')}Hilfe & erste Schritte</button><button class="profile-button" data-action="profile-menu">${avatar(store.profile.fullName,'',store.profile.avatar)}<span class="grow"><strong>${esc(store.profile.fullName)}</strong><small>Persönlicher Bereich</small></span>${icon('down','sm')}</button><button class="local-note" data-action="about">${icon('shield','sm')}Lokaler CLI-Arbeitsplatz</button></div>`}
function renderHeader(){const c=store.chats.find(x=>x.id===ui.id),p=store.projects.find(x=>x.id===ui.project);let title=Titles[ui.view]||'Chat';let detail='';if(ui.view==='chat')detail=ui.id?c?.title||'Chat':ui.agent?store.agents.find(x=>x.id===ui.agent)?.name:'Neuer Chat';if(ui.view==='project')detail=store.projects.find(x=>x.id===ui.id)?.name;$('#topbar').innerHTML=`<button class="icon-btn mobile-menu" data-action="sidebar-toggle" aria-label="Navigation öffnen">${icon('panel')}</button><div class="breadcrumbs"><span class="muted">${esc(title)}</span>${detail?icon('chevron','sm')+`<span class="truncate">${esc(detail)}</span>`:''}</div><div class="topbar-end"><button class="demo-pill" data-action="about"><span class="dot"></span>${endpoint.enabled?'API-Modus':'Lokale Demo'}</button>${ui.view==='chat'?btn('Teilen','share-current','share','ghost'):''}${ui.view==='chat'?ib('dots','chat-header-menu','Weitere Chat-Aktionen'):ib('help','help','Hilfe öffnen')}</div>`}
function renderView(){switch(ui.view){case'chat':return renderChat();case'agents':return renderAgents();case'agent-edit':return renderAgentEditor();case'workflows':return renderWorkflows();case'workflow':return renderWorkflow();case'library':return renderLibrary();case'projects':return renderProjects();case'project':return renderProject();case'prompts':return renderPrompts();case'integrations':return renderIntegrations();case'skills':return renderSkills();case'tasks':return renderTasks();case'settings':return renderSettings();default:return renderChat()}}
function pageHead(title,description,actions=''){return `<div class="page-head between"><div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${actions}</div>`}
function searchBox(placeholder='Suchen …',id='pageSearch'){return `<div class="search-box">${icon('search')}<input id="${id}" data-input="filter" aria-label="${esc(placeholder)}" placeholder="${esc(placeholder)}" autocomplete="off"></div>`}
function tabs(items,active=ui.tab){return `<div class="tabs" role="tablist">${items.map(([id,label,count])=>`<button class="tab ${active===id?'active':''}" role="tab" aria-selected="${active===id}" data-action="tab" data-tab="${id}">${label}${count!==undefined?badge(count):''}</button>`).join('')}</div>`}
function empty(title,description,action='',ic='search'){return `<div class="empty"><div class="icon-tile gray">${icon(ic)}</div><h3>${esc(title)}</h3><p>${esc(description)}</p>${action}</div>`}
function filterEmpty(){return `<div id="filterEmpty" class="hide">${empty('Keine Ergebnisse','Versuche einen anderen Suchbegriff.','','search')}</div>`}
function field(label,name,value='',type='text',help='',extra=''){let el=type==='textarea'?`<textarea name="${name}" ${extra}>${esc(value)}</textarea>`:`<input type="${type}" name="${name}" value="${esc(value)}" ${extra}>`;return `<div class="field"><label for="f-${name}">${esc(label)}</label>${el.replace(/^(<\w+)/,`$1 id="f-${name}"`)}${help?`<small>${help}</small>`:''}</div>`}
function selectField(label,name,values,current){return `<div class="field"><label for="f-${name}">${esc(label)}</label><select id="f-${name}" name="${name}">${values.map(v=>{let [val,txt]=Array.isArray(v)?v:[v,v];return `<option value="${esc(val)}" ${String(current)===String(val)?'selected':''}>${esc(txt)}</option>`}).join('')}</select></div>`}
function toggle(group,key,value,label,disabled=false){return `<button class="switch" role="switch" aria-checked="${!!value}" aria-label="${esc(label)}" data-action="toggle" data-group="${group}" data-key="${key}" ${disabled?'disabled':''}></button>`}
function settingRow(label,desc,control){return `<div class="setting-row"><div class="setting-label"><strong>${label}</strong>${desc?`<p>${desc}</p>`:''}</div>${control}</div>`}
function callout(text,ic='info',cls=''){return `<div class="callout ${cls}">${icon(ic,'sm')}<div>${text}</div></div>`}
function miniModel(id){return `<span class="flex">${modelIcon(id)}<span>${esc(modelName(id))}</span></span>`}
function composer(){const m=ui.model;return `<div class="composer" id="composerDrop"><div class="attachment-chips ${ui.attachments.length?'':'hide'}" id="attachments">${ui.attachments.map(id=>{const d=store.docs.find(x=>x.id===id);return d?`<div class="attachment-chip">${icon('file','sm')}<span class="truncate">${esc(d.name)}</span>${ib('close','attachment-remove','Anhang entfernen',`data-id="${id}"`)}</div>`:''}).join('')}</div><textarea id="composerInput" rows="2" aria-label="Nachricht eingeben" placeholder="Frage etwas oder gib eine Aufgabe ein …" maxlength="50000">${esc(ui.draft)}</textarea><div class="compose-tools">${ib('plus','attach-menu','Dateien, Vorlagen und Wissen hinzufügen')}<button class="model-button" data-action="model-menu" title="Modell auswählen">${icon(m==='auto'?'spark':m==='local'?'terminal':'brain','sm')}<span>${esc(modelName(m))}</span>${icon('down','sm')}</button><span style="height:16px;border-left:1px solid var(--line);margin:0 5px"></span>${store.capabilities.web&&store.prefs.web?`<button class="tool-chip ${ui.tools.web?'active':''}" data-action="chat-tool" data-tool="web" title="Websuche · Demo-Vorschau">${icon('globe')}<span class="tool-label">Websuche</span></button>`:''}${store.capabilities.research?`<button class="tool-chip ${ui.tools.research?'active':''}" data-action="chat-tool" data-tool="research" title="Deep Research · Demo-Vorschau">${icon('search')}<span class="tool-label">Deep Research</span></button>`:''}${store.capabilities.knowledge?`<button class="tool-chip ${ui.tools.knowledge?'active':''}" data-action="chat-tool" data-tool="knowledge" title="Lokale Dokumente durchsuchen">${icon('book')}<span class="tool-label">Wissen</span></button>`:''}<span class="spacer"></span>${ib('mic','voice','Spracheingabe')}<button class="send" data-action="${ui.busy?'stop-generation':'send'}" id="sendButton" aria-label="${ui.busy?'Antwort stoppen':'Nachricht senden'}" ${!ui.busy&&!ui.draft.trim()&&!ui.attachments.length?'disabled':''}>${icon(ui.busy?'stop':'arrow','sm')}</button></div></div><div class="composer-disclaimer">${esc(store.workspace.disclaimer)} <button data-action="about" style="font-size:inherit;color:inherit;padding:0;text-decoration:underline">${endpoint.enabled?'Eigener API-Endpunkt':'Demo ohne KI-Verbindung'}</button></div>`}
function renderChat(){const c=store.chats.find(x=>x.id===ui.id);const a=store.agents.find(x=>x.id===ui.agent),p=store.projects.find(x=>x.id===ui.project);let body='';if(!c){const prompts=a?.starters?.length?a.starters:['Schreibe eine klare E-Mail','Fasse ein Dokument zusammen','Erkläre mir diesen Code','Entwickle neue Ideen'];const ics=['pen','file','chart','spark'];body=`<div class="welcome"><div class="welcome-title">${a?`<div class="icon-tile ${a.color} agent-welcome-icon">${icon(a.icon,'lg')}</div>`:store.workspace.showLogo?brand(true):''}<div class="greeting">${a?'Dein spezialisierter Agent':p?esc(p.name):'Guten Tag, '+esc(store.profile.name)}</div><h1>${a?esc(a.name):esc(store.workspace.welcome)}</h1>${a?`<p>${esc(a.description)}</p>`:''}</div>${composer()}<div class="suggestions">${prompts.slice(0,4).map((t,i)=>`<button class="suggestion" data-action="suggestion" data-text="${esc(t)}">${icon(ics[i])}<span>${esc(t)}</span></button>`).join('')}</div>${!a?`<div class="welcome-agents"><header><span>DEINE AGENTEN</span><button class="flex muted" style="font-size:10px" data-action="nav" data-view="agents">Alle ansehen ${icon('arrowRight','sm')}</button></header><div class="agent-shortcuts">${store.agents.filter(x=>!x.archived).slice(0,3).map(x=>`<button class="agent-shortcut" data-action="agent-chat" data-id="${x.id}"><span class="icon-tile ${x.color}">${icon(x.icon)}</span><span class="truncate"><strong>${esc(x.name)}</strong><span class="desc">${esc(x.category)}</span></span></button>`).join('')}</div></div>`:''}</div>`}else{body=`<div class="messages" id="messages" role="log" aria-label="Chatverlauf">${c.messages.map(m=>renderMessage(m,c)).join('')}</div><div class="chat-bottom">${ui.tools.research||ui.tools.web?`<div class="chat-tool-hint">${icon('info','sm')}Offline-Vorschau: keine echte Internetrecherche.</div>`:''}${composer()}</div>`}return `<div class="chat-layout"><div class="chat-main">${p?`<div class="context-bar">${icon('folder','sm')}<button data-action="open-project" data-id="${p.id}" style="font-size:11px">${esc(p.name)}</button><span class="spacer"></span>${badge('Projektkontext')}</div>`:''}${body}</div>${ui.canvas?renderCanvas():''}</div>`}
function formatText(text){let blocks=[];let s=esc(text).replace(/```([^\n]*)\n([\s\S]*?)```/g,(_,lang,code)=>{blocks.push(`<pre><code>${code}</code></pre>`);return `\n%%CODE${blocks.length-1}%%\n`});s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h2>$1</h2>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');s=s.split(/\n\n+/).map(x=>/^<(h[23]|pre|blockquote)/.test(x)?x.replace(/\n/g,'<br>'):`<p>${x.replace(/\n/g,'<br>')}</p>`).join('');return s.replace(/%%CODE(\d+)%%/g,(_,i)=>blocks[+i])}
function renderMessage(m,c){const assistant=m.role==='assistant';const ongoing=ui.busy?.message===m.id;return `<article class="message ${m.role}" data-message="${m.id}">${assistant?`<div class="message-head"><span class="model-mark">${icon('spark','sm')}</span>${esc(modelName(m.model||c.model))}${badge(m.demo?'Beispielantwort':'API-Antwort')}${m.stopped?badge('Gestoppt'):''}</div>`:''}<div class="${assistant?'message-content':'bubble'} ${ongoing?'typing':''}" id="text-${m.id}">${assistant?formatText(m.text):esc(m.text)}</div>${m.files?.length?`<div class="source-pills">${m.files.map(id=>{const d=store.docs.find(x=>x.id===id);return d?`<button class="source-pill" data-action="doc-open" data-id="${id}">${icon('file','sm')}${esc(d.name)}</button>`:''}).join('')}</div>`:''}${!ongoing?`<div class="message-actions">${ib('copy','message-copy','Nachricht kopieren',`data-id="${m.id}"`)}${assistant?ib('refresh','message-regenerate','Antwort neu erstellen',`data-id="${m.id}"`)+ib('file','message-canvas','Im Dokument bearbeiten',`data-id="${m.id}"`)+ib('thumb','message-like','Antwort bewerten',`data-id="${m.id}"`)+ib('download','message-download','Antwort herunterladen',`data-id="${m.id}"`)+(m.liked?badge('Hilfreich','green'):''):ib('edit','message-edit','Nachricht bearbeiten',`data-id="${m.id}"`)+ib('plus','message-prompt','Als Prompt speichern',`data-id="${m.id}"`)}</div>`:''}</article>`}

function renderAgents(){let list=store.agents.filter(a=>ui.tab==='archived'?a.archived:!a.archived);if(ui.tab==='mine')list=list.filter(a=>a.owner==='Du');if(ui.tab==='starred')list=list.filter(a=>a.star);if(ui.filter!=='Alle')list=list.filter(a=>a.category===ui.filter);return `<div class="page">${pageHead('Agenten','Deine Experten. Mit dem Wissen und den Fähigkeiten, die du brauchst.',btn('Agent erstellen','agent-create','plus','primary'))}${tabs([['all','Alle Agenten',store.agents.filter(a=>!a.archived).length],['mine','Meine Agenten'],['starred','Favoriten'],['archived','Archiv']])}<div class="toolbar">${searchBox('Agenten suchen …')}<span class="spacer"></span>${btn('Vorlagen entdecken','agent-templates','spark','sm')}</div><div class="filters" style="margin-bottom:22px">${['Alle','Produktivität','Marketing','Daten & Analyse','Support'].map(x=>`<button class="filter ${ui.filter===x?'active':''}" data-action="category" data-value="${x}">${x}</button>`).join('')}</div>${ui.tab==='all'&&ui.filter==='Alle'?`<div class="feature-band"><div class="icon-tile">${icon('agents','lg')}</div><div><h3>Beschreibe deinen Agenten – der Builder konfiguriert den Entwurf.</h3><p>Anweisungen, Modell, Wissen, Actions und Trigger bleiben sichtbar und jederzeit editierbar.</p></div>${btn('Loslegen','agent-create','arrowRight','sm')}</div>`:''}<div class="cards">${list.map(a=>`<article class="card clickable" data-search="${esc(a.name+' '+a.description+' '+a.category)}"><div class="between"><button class="icon-tile ${a.color}" data-action="agent-chat" data-id="${a.id}" aria-label="${esc(a.name)} starten">${icon(a.icon)}</button><div class="flex">${a.verified?`<span title="In der Demo als geprüft markiert" style="color:var(--accent)">${icon('shield','sm')}</span>`:''}${ib(a.star?'star':'star','agent-star','Favorit umschalten',`data-id="${a.id}" style="${a.star?'color:var(--accent)':''}"`)}${ib('dots','agent-menu','Agent verwalten',`data-id="${a.id}"`)}</div></div><button data-action="agent-chat" data-id="${a.id}" style="text-align:left;padding:0;width:100%"><h3>${esc(a.name)}</h3><p style="min-height:39px">${esc(a.description)}</p></button><div class="card-foot">${avatar(a.owner,'a1')}<span>${esc(a.owner==='Du'?store.profile.name:a.owner)}</span><span class="spacer"></span>${badge(a.category)}</div></article>`).join('')}</div>${!list.length?empty('Hier ist noch Platz','Erstelle einen Agenten oder ändere deinen Filter.',btn('Agent erstellen','agent-create','plus','primary'),'agents'):''}${filterEmpty()}</div>`}
function renderAgentEditor(){const a=ui.editAgent;if(!a)return empty('Agent nicht gefunden','Öffne die Agentenübersicht.',btn('Zu den Agenten','nav','agents','','data-view="agents"'));a.integrations=a.integrations||[];return `<div style="height:100%;display:flex;flex-direction:column"><div class="builder-toolbar">${ib('arrowLeft','nav','Zurück zu Agenten','data-view="agents"')}<div class="builder-title grow"><strong>${esc(a.name||'Neuer Agent')}</strong><span>${a.version?'Version '+a.version:'Nicht veröffentlicht'}</span></div><span class="saved-indicator">${icon('lock','sm')}${a.visibility==='private'?'Nur du':'Workspace'}</span>${btn('Entwurf speichern','agent-save','check','sm')}${btn(a.version?'Aktualisieren':'Veröffentlichen','agent-publish','share','primary sm')}</div><div class="builder agent-builder-layout">${renderAgentSide(a)}<section class="builder-config ${ui.agentBuilderPulse?'ai-updated':''}"><div class="builder-config-head"><div><span class="eyebrow">AGENT-KONFIGURATION</span><h2>${esc(a.name||'Neuer Agent')}</h2><p>Definiere Verhalten, Wissen, Actions und Zugriffsrechte.</p></div><div class="config-health"><span class="dot"></span>${a.name&&a.instructions?'Bereit zum Testen':'Entwurf vervollständigen'}</div></div><div class="tabs" style="margin-bottom:24px">${[['config','Konfiguration'],['knowledge','Wissen & Actions'],['sharing','Trigger & Freigabe'],['versions','Versionen']].map(([id,t])=>`<button class="tab ${ui.agentTab===id?'active':''}" data-action="agent-tab" data-tab="${id}">${t}</button>`).join('')}</div><form id="agentForm" data-form="agent"><div class="${ui.agentTab==='config'?'':'hide'}"><div class="agent-identity"><div class="icon-tile ${a.color}">${icon(a.icon)}</div><div><strong>Profil des Agenten</strong><p>Diese Angaben sehen Personen, bevor sie den Agenten starten.</p></div></div>${field('Name','name',a.name,'text','', 'required maxlength="80" placeholder="z. B. IT Help Desk"')}${field('Beschreibung','description',a.description,'textarea','Eine knappe Erklärung, wofür dieser Agent gedacht ist.','maxlength="500" rows="3"')}${field('Anweisungen','instructions',a.instructions,'textarea','Definiere Ziel, Arbeitsweise, Grenzen und gewünschtes Ausgabeformat.','style="min-height:220px" maxlength="20000" placeholder="Ziel\n…\n\nArbeitsweise\n…"')}<div class="field-row">${selectField('Modell','model',Models.filter(m=>m.id==='auto'||live.runners.some(r=>r.id===m.id&&r.enabled&&r.available)).map(m=>[m.id,m.name]),a.model)}${selectField('Kategorie','category',['Produktivität','Marketing','Daten & Analyse','Support','Entwicklung'],a.category)}</div><div class="field-row">${selectField('Symbol','icon',[['agents','Agent'],['pen','Schreiben'],['book','Wissen'],['chart','Analyse'],['terminal','Entwicklung'],['spark','Kreativität'],['checklist','Checkliste']],a.icon)}${selectField('Farbe','color',[['blue','Blau'],['peach','Apricot'],['green','Grün'],['pink','Lavendel'],['gold','Gold'],['gray','Grau']],a.color)}</div>${field('Prompt-Vorschläge','starters',(a.starters||[]).join('\n'),'textarea','Eine Idee pro Zeile. Bis zu vier erscheinen beim Start.','rows="4"')}</div><div class="${ui.agentTab==='knowledge'?'':'hide'}"><div class="section-intro"><h3>Wissen</h3><p>Wähle Quellen, die der Agent beim Antworten berücksichtigen soll.</p></div><div class="knowledge-list">${store.docs.map(d=>`<label class="checklist-row"><input type="checkbox" name="knowledge" value="${d.id}" ${(a.knowledge||[]).includes(d.id)?'checked':''}><span class="grow"><strong>${esc(d.name)}</strong><p>${d.kind==='metadata'?'Nur Metadaten · kein Parser verfügbar':bytes(d.size)+' · lokal lesbar'}</p></span><span class="source-kind">${d.kind==='text'?'Text':d.kind==='image'?'Bild':'Datei'}</span></label>`).join('')||callout('Noch keine Dokumente in der Bibliothek.','file')}</div><div class="builder-section"><div class="section-intro"><h3>Fähigkeiten</h3><p>Grundfunktionen, die der Agent verwenden darf.</p></div><div class="capability-grid">${[['web','globe','Websuche','Aktuelle Informationen recherchieren.'],['files','file','Dateien lesen','Lokale Dateien als Kontext verwenden.'],['knowledge','book','Wissenssuche','Hinterlegte Dokumente gezielt durchsuchen.'],['images','image','Bilder','Bildaufgaben vorbereiten.'],['canvas','layout','Canvas','Ergebnisse als Dokument weiterbearbeiten.']].map(([id,ic,t,d])=>`<label class="capability-card"><input type="checkbox" name="capabilities" value="${id}" ${(a.capabilities||[]).includes(id)?'checked':''}><span class="icon-tile gray">${icon(ic,'sm')}</span><span><strong>${t}</strong><small>${d}</small></span></label>`).join('')}</div></div><div class="builder-section"><div class="section-intro"><h3>Integrationen & Actions</h3><p>Lege fest, welche verbundenen Systeme der Agent verwenden darf.</p></div><div class="integration-picker">${Integrations.slice(0,12).map(([id,name,,cat])=>`<label class="integration-pick"><input type="checkbox" name="integrations" value="${id}" ${(a.integrations||[]).includes(id)?'checked':''}>${integrationLogo(id)}<span><strong>${esc(name)}</strong><small>${esc(cat)}</small></span></label>`).join('')}</div>${callout('Verbindungen sind in dieser Ein-Datei-Version simuliert. Auswahl und Freigaben bleiben lokal.','lock')}</div><div class="builder-section"><div class="section-intro"><h3>Subagenten</h3><p>Delegiere spezialisierte Teilaufgaben an andere Agenten.</p></div><div class="filters">${store.agents.filter(x=>x.id!==a.id&&!x.archived).map(x=>`<label class="check-pill"><input type="checkbox" name="subagents" value="${x.id}" ${(a.subagents||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')||'<span class="muted small">Keine weiteren Agenten verfügbar.</span>'}</div></div></div><div class="${ui.agentTab==='sharing'?'':'hide'}"><div class="section-intro"><h3>Trigger & Zugriff</h3><p>Bestimme, wie der Agent gestartet und mit wem er geteilt wird.</p></div><div class="setting-card">${selectField('Sichtbarkeit','visibility',[['private','Nur ich'],['workspace','Gesamter Workspace'],['group','Ausgewählte Gruppe']],a.visibility)}${selectField('Gruppe','group',store.groups.map(g=>[g.id,g.name]),a.group||store.groups[0]?.id)}</div><div class="builder-section"><h3>Eingabetyp</h3><div class="trigger-options"><label class="trigger-card"><input type="radio" name="inputType" value="chat" ${(a.inputType||'chat')==='chat'?'checked':''}><span class="icon-tile blue">${icon('chat')}</span><span><strong>Direkter Prompt</strong><small>Freier Chat für flexible Aufgaben.</small></span></label><label class="trigger-card"><input type="radio" name="inputType" value="form" ${a.inputType==='form'?'checked':''}><span class="icon-tile pink">${icon('checklist')}</span><span><strong>Strukturiertes Formular</strong><small>Definierte Eingabefelder für wiederholbare Aufgaben.</small></span></label></div>${field('Formularfelder','formFields',(a.formFields||'Thema\nZielgruppe'),'textarea','Ein Feldname pro Zeile. Wird beim Start abgefragt.','rows="4"')}</div><div class="builder-section"><h3>Bereitstellung</h3>${callout('Veröffentlichen speichert eine Version in SQLite. Diese Installation hat einen lokalen Eigentümer; Team-, Slack- und Teams-Freigaben sind nicht angeschlossen.','share','purple')}</div></div><div class="${ui.agentTab==='versions'?'':'hide'}"><div class="section-intro"><h3>Versionsverlauf</h3><p>Veröffentlichte Änderungen bleiben als lokale Version wiederherstellbar.</p></div>${(a.history||[]).slice().reverse().map((h,i)=>`<div class="version-row"><div class="version-dot">v${h.version}</div><div class="grow"><strong>Version ${h.version}</strong><p>${dt(h.at,{dateStyle:'medium',timeStyle:'short'})}</p></div>${btn('Wiederherstellen','agent-restore','history','sm',`data-index="${a.history.length-1-i}"`)}</div>`).join('')||empty('Noch keine Versionen','Veröffentliche den Agenten, um die erste Version anzulegen.','','history')}</div></form></section></div></div>`}
function renderProjects(){return `<div class="page">${pageHead('Projekte','Chats, Anweisungen und Wissen für ein gemeinsames Ziel.',btn('Neues Projekt','project-create','plus','primary'))}<div class="toolbar">${searchBox('Projekte suchen …')}</div><div class="cards">${store.projects.map(p=>`<article class="card" data-search="${esc(p.name+' '+p.description)}"><div class="between"><div class="icon-tile ${p.color||'blue'}">${icon('folder')}</div>${ib('dots','project-menu','Projekt verwalten',`data-id="${p.id}"`)}</div><button style="text-align:left;padding:0" data-action="open-project" data-id="${p.id}"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p></button><div class="card-foot">${icon('chat','sm')}${store.chats.filter(c=>c.project===p.id).length} Chats<span class="spacer"></span>${badge('Privat')}</div></article>`).join('')}</div>${filterEmpty()}</div>`}
function renderProject(){const p=store.projects.find(x=>x.id===ui.id);if(!p)return empty('Projekt nicht gefunden','Das Projekt wurde möglicherweise gelöscht.',btn('Alle Projekte','nav','folder','','data-view="projects"'));const chats=store.chats.filter(c=>c.project===p.id);return `<div class="page">${pageHead(p.name,p.description,btn('Neuer Chat','project-chat','plus','primary',`data-id="${p.id}"`))}<div class="feature-band"><div class="icon-tile ${p.color}">${icon('folder')}</div><div class="grow"><h3>Projektanweisungen</h3><p>${esc(p.instructions||'Noch keine Anweisungen hinterlegt.')}</p></div>${btn('Bearbeiten','project-edit','edit','sm',`data-id="${p.id}"`)}</div><div class="between section-gap" style="margin-bottom:15px"><h3>Chats in diesem Projekt</h3><span class="muted small">${chats.length} Unterhaltungen</span></div>${chats.map(c=>`<div class="row-line"><div class="icon-tile gray">${icon('chat')}</div><button class="grow table-name" data-action="open-chat" data-id="${c.id}">${esc(c.title)}<p>${dt(c.updated)} · ${esc(modelName(c.model))}</p></button>${ib('dots','chat-menu','Chat verwalten',`data-id="${c.id}"`)}</div>`).join('')||empty('Dein Projekt beginnt hier','Starte einen Chat mit den Anweisungen dieses Projekts.',btn('Chat starten','project-chat','plus','primary',`data-id="${p.id}"`),'chat')}<div class="between section-gap" style="margin-bottom:15px"><h3>Projektwissen</h3>${btn('Wissen auswählen','project-knowledge','plus','sm',`data-id="${p.id}"`)}</div><div class="source-pills">${(p.knowledge||[]).map(id=>{const d=store.docs.find(x=>x.id===id);return d?btn(esc(d.name),'doc-open','file','sm',`data-id="${id}"`):''}).join('')||'<span class="muted small">Wähle Dokumente aus deiner Bibliothek.</span>'}</div></div>`}
function renderLibrary(){const folder=store.folders.find(f=>f.id===ui.folder);let docs=store.docs.filter(d=>!ui.folder||d.folder===ui.folder);if(ui.tab==='recent')docs=docs.sort((a,b)=>b.created-a.created);return `<div class="page">${pageHead(folder?.name||'Bibliothek',folder?.description||'Dein Wissen. Wiederverwendbar und an einem Ort.',`<div class="flex">${btn('Ordner','folder-create','plus')}${btn('Hochladen','upload-library','upload','primary')}</div>`)}${folder?`<button class="flex muted" data-action="folder-back" style="font-size:11px;margin-bottom:20px">${icon('arrowLeft','sm')}Zur Bibliothek</button>`:tabs([['all','Alle Dateien'],['recent','Zuletzt verwendet'],['knowledge','Wissensdatenbanken']])}<div class="toolbar">${searchBox('Dateien und Ordner suchen …')}<span class="spacer"></span><span class="muted small">${docs.length} Dateien</span>${btn('Textdatei','doc-create','plus','sm')}</div>${!folder&&ui.tab!=='recent'?`<div class="cards" style="margin-bottom:28px">${store.folders.filter(f=>ui.tab!=='knowledge'||f.type==='knowledge').map(f=>`<article class="card" data-search="${esc(f.name+' '+f.description)}" style="padding:16px"><div class="between"><button class="flex" data-action="folder-open" data-id="${f.id}"><div class="icon-tile ${f.type==='knowledge'?'blue':'gray'}">${icon(f.type==='knowledge'?'book':'folder')}</div><span style="text-align:left"><strong style="font-size:12px">${esc(f.name)}</strong><span class="muted" style="font-size:10px;display:block;margin-top:5px">${store.docs.filter(d=>d.folder===f.id).length} Dateien</span></span></button>${ib('dots','folder-menu','Ordner verwalten',`data-id="${f.id}"`)}</div></article>`).join('')}</div>`:''}${ui.tab!=='knowledge'||folder?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Ordner</th><th>Größe</th><th>Hinzugefügt</th><th></th></tr></thead><tbody>${docs.map(d=>`<tr data-search="${esc(d.name+' '+(d.text||'').slice(0,500))}"><td><div class="flex"><div class="icon-tile ${/csv/.test(d.name)?'green':d.kind==='image'?'pink':'gray'}">${icon(/csv/.test(d.name)?'chart':d.kind==='image'?'image':'file')}</div><button class="table-name" data-action="doc-open" data-id="${d.id}">${esc(d.name)}${d.kind==='metadata'?'<p>Nur Metadaten · kein Dokumentparser</p>':''}</button></div></td><td class="muted">${esc(store.folders.find(f=>f.id===d.folder)?.name||'—')}</td><td class="muted nowrap">${bytes(d.size)}</td><td class="muted nowrap">${dt(d.created)}</td><td>${ib('dots','doc-menu','Datei verwalten',`data-id="${d.id}"`)}</td></tr>`).join('')}</tbody></table></div>${!docs.length?empty('Noch keine Dateien','Lade Dateien hoch oder erstelle ein Textdokument.',btn('Hochladen','upload-library','upload','primary'),'library'):''}`:''}${filterEmpty()}<div style="margin-top:24px">${callout('Text, Markdown, CSV und JSON werden lokal gelesen. Bilder können angezeigt werden. PDF- und Office-Dateien werden nur mit Metadaten gespeichert; ihre Inhalte werden nicht analysiert.','lock')}</div></div>`}
function renderPrompts(){let list=store.prompts.filter(p=>ui.tab==='mine'?p.visibility==='private':ui.tab==='starred'?p.star:true);return `<div class="page">${pageHead('Prompt-Bibliothek','Gute Fragen musst du nur einmal formulieren.',btn('Prompt erstellen','prompt-create','plus','primary'))}${tabs([['all','Alle Prompts'],['mine','Meine Prompts'],['starred','Favoriten']])}<div class="toolbar">${searchBox('Prompts suchen …')}<span class="result-count">${list.length} Vorlagen</span></div><div class="cards">${list.map(p=>`<article class="card" data-search="${esc(p.name+' '+p.text+' '+p.category)}"><div class="between"><div class="icon-tile gray">${icon('book')}</div><div class="flex">${ib('star','prompt-star','Favorit umschalten',`data-id="${p.id}" style="${p.star?'color:var(--accent)':''}"`)}${ib('dots','prompt-menu','Prompt verwalten',`data-id="${p.id}"`)}</div></div><h3>${esc(p.name)}</h3><p style="min-height:57px">${esc(p.text.slice(0,128))}${p.text.length>128?' …':''}</p><div class="card-foot">${badge(p.category)}<span class="spacer"></span>${btn('Verwenden','prompt-use','arrowRight','sm ghost',`data-id="${p.id}"`)}</div></article>`).join('')}</div>${!list.length?empty('Noch keine Prompts','Speichere häufige Aufgaben als wiederverwendbare Vorlage.',btn('Prompt erstellen','prompt-create','plus','primary'),'book'):''}${filterEmpty()}</div>`}
function integrationLogo(id){const marks={gdrive:'△',microsoft:'▦',slack:'#',notion:'N',gmail:'M',calendar:'31',jira:'◆',confluence:'C',github:'GH',hubspot:'H',salesforce:'S',linear:'◒',asana:'∴',zendesk:'Z',figma:'F',mcp:'⌁',outlook:'O',teams:'T'};return `<span class="integration-logo ${id}">${marks[id]||'⌁'}</span>`}
function renderIntegrations(){let list=Integrations.filter(i=>ui.tab!=='connected'||store.connections[i[0]]?.connected).filter(i=>ui.filter==='Alle'||i[3]===ui.filter);return `<div class="page">${pageHead('Integrationen','Verbinde Apps, Wissen und Actions mit Agenten und Workflows.',btn('Eigene Integration','integration-custom','plus'))}${tabs([['all','Alle Integrationen'],['connected','Meine Verbindungen',Object.values(store.connections).filter(c=>c.connected).length]])}<div class="toolbar">${searchBox('Integrationen suchen …')}<span class="spacer"></span><span class="integration-summary"><strong>56</strong> Integrationen · <strong>716</strong> Actions</span>${badge('Demo-Verbindungen','amber')}</div><div class="filters" style="margin-bottom:24px">${['Alle','Wissen','Kommunikation','Produktivität','Entwicklung','CRM','Support'].map(c=>`<button class="filter ${ui.filter===c?'active':''}" data-action="category" data-value="${c}">${c}</button>`).join('')}</div><div class="cards integrations-grid">${list.map(([id,name,desc,cat])=>`<article class="card" data-search="${esc(name+' '+desc+' '+cat)}"><div class="flex">${integrationLogo(id)}<h3>${name}</h3></div><p>${desc}</p><div class="between" style="margin-top:20px">${badge(cat)}${btn(store.connections[id]?.connected?'Verwalten':'Verbinden','integration-open',store.connections[id]?.connected?'check':'plus','sm',`data-id="${id}"`)}</div>${store.connections[id]?.connected?'<div class="dot" style="position:absolute;right:15px;top:15px" title="Demo-Verbindung eingerichtet"></div>':''}</article>`).join('')}${Object.entries(store.connections).filter(([id,c])=>c.custom&&(ui.tab!=='connected'||c.connected)).map(([id,c])=>`<article class="card" data-search="${esc(c.name)}"><div class="flex">${integrationLogo('mcp')}<h3>${esc(c.name)}</h3></div><p>Eigene Konfiguration · ${esc(c.protocol||'MCP')}</p><div class="between" style="margin-top:20px">${badge('Demo')}${btn('Verwalten','integration-open','','sm',`data-id="${id}"`)}</div></article>`).join('')}</div>${!list.length&&ui.tab==='connected'?empty('Noch nicht verbunden','Richte eine lokale Beispielverbindung ein. Es wird kein OAuth-Vorgang ausgeführt.',btn('Integrationen entdecken','tab','','','data-tab="all"'),'integrations'):''}${filterEmpty()}</div>`}
function renderSkills(){return `<div class="page">${pageHead('Skills','Wiederverwendbare Anweisungen für konsistente Ergebnisse.',btn('Skill erstellen','skill-create','plus','primary'))}${callout('Aktive Skills werden im API-Modus als zusätzliche Anweisungen übergeben. In der lokalen Demo kannst du sie erstellen, bearbeiten und zuordnen.','bolt','purple')}<div class="toolbar">${searchBox('Skills suchen …')}</div><div class="cards">${store.skills.map(s=>`<article class="card" data-search="${esc(s.name+' '+s.description)}"><div class="between"><div class="icon-tile blue">${icon('bolt')}</div>${toggle('skill',s.id,s.enabled,s.name)}</div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="card-foot">${badge(s.enabled?'Aktiv':'Inaktiv',s.enabled?'green':'')}<span class="spacer"></span>${ib('edit','skill-edit','Skill bearbeiten',`data-id="${s.id}"`)}${ib('download','skill-export','SKILL.md exportieren',`data-id="${s.id}"`)}${ib('trash','skill-delete','Skill löschen',`data-id="${s.id}"`)}</div></article>`).join('')}</div>${filterEmpty()}</div>`}
function renderTasks(){return `<div class="page">${pageHead('Geplante Aufgaben','Wiederkehrende Aufgaben vorbereiten und manuell testen.',btn('Aufgabe erstellen','task-create','plus','primary'))}${callout('Diese HTML-Datei hat keinen Hintergrunddienst. Zeitpläne sind gespeicherte Konfigurationen und werden nicht automatisch ausgeführt. „Jetzt testen“ öffnet einen lokalen Chat.','clock','warning')}<div class="toolbar">${searchBox('Aufgaben suchen …')}</div>${store.tasks.map(t=>`<div class="card" data-search="${esc(t.name+' '+t.prompt)}" style="margin-bottom:13px"><div class="flex"><div class="icon-tile blue">${icon('clock')}</div><div class="grow"><h3 style="margin:0">${esc(t.name)}</h3><p style="margin:5px 0 0">${esc(t.schedule)} · ${esc(t.time)} · ${t.enabled?'Plan aktiviert (nur Konfiguration)':'Pausiert'}</p></div>${toggle('task',t.id,t.enabled,'Zeitplan aktivieren')}</div><p>${esc(t.prompt)}</p><div class="between" style="margin-top:16px"><span class="muted small">${t.lastRun?'Zuletzt getestet: '+dt(t.lastRun,{dateStyle:'short',timeStyle:'short'}):'Noch nicht getestet'}</span><div class="flex">${ib('edit','task-edit','Aufgabe bearbeiten',`data-id="${t.id}"`)}${ib('trash','task-delete','Aufgabe löschen',`data-id="${t.id}"`)}${btn('Jetzt testen','task-run','play','sm',`data-id="${t.id}"`)}</div></div></div>`).join('')||empty('Keine geplanten Aufgaben','Erstelle eine wiederkehrende Aufgabe als lokale Konfiguration.',btn('Aufgabe erstellen','task-create','plus'),'clock')}${filterEmpty()}</div>`}
const NodeTypes={trigger:{name:'Start',icon:'play',color:'green',description:'Eingabe für den Workflow'},ai:{name:'KI-Schritt',icon:'spark',color:'blue',description:'Lokale Beispiel-Zusammenfassung'},transform:{name:'Text transformieren',icon:'code',color:'pink',description:'Text in Zeilen aufteilen'},condition:{name:'Bedingung',icon:'branch',color:'gold',description:'Prüfen, ob Eingabe Text enthält'},approval:{name:'Freigabe',icon:'user',color:'peach',description:'Auf deine Bestätigung warten'},output:{name:'Dokument speichern',icon:'file',color:'green',description:'Ergebnis in der lokalen Bibliothek'},http:{name:'HTTP-Anfrage',icon:'globe',color:'gray',description:'Nicht ausführbar ohne sicheren Backend-Adapter'}};
function renderWorkflows(){const list=store.workflows.filter(w=>ui.tab==='active'?w.active:ui.tab==='draft'?!w.active:true);return `<div class="page">${pageHead('Workflows','Automatisiere Prozesse mit KI, Actions, Bedingungen und Freigaben.',btn('Workflow erstellen','workflow-create','plus','primary'))}${tabs([['all','Alle Workflows'],['active','Veröffentlicht'],['draft','Entwürfe']])}<div class="toolbar">${searchBox('Workflows suchen …')}<span class="spacer"></span>${btn('Beispielvorlagen','workflow-templates','spark','sm')}</div><div class="feature-band"><div class="icon-tile">${icon('workflow','lg')}</div><div><h3>Vom Trigger bis zur Action – visuell gebaut.</h3><p>Kombiniere echte CLI-Schritte, Textverarbeitung, Bedingungen und Freigaben. Start erfolgt manuell; kein Zeitplaner.</p></div>${btn('Workflow bauen','workflow-create','arrowRight','sm')}</div><div class="cards">${list.map(w=>`<article class="card" data-search="${esc(w.name+' '+w.description)}"><div class="between"><div class="icon-tile blue">${icon('workflow')}</div>${ib('dots','workflow-menu','Workflow verwalten',`data-id="${w.id}"`)}</div><button style="text-align:left;padding:0" data-action="workflow-open" data-id="${w.id}"><h3>${esc(w.name)}</h3><p>${esc(w.description)}</p></button><div style="display:flex;align-items:center;gap:5px;margin-top:17px">${w.nodes.slice(0,6).map((n,i)=>`${i?'<span class="muted">—</span>':''}<span class="icon-tile ${NodeTypes[n.type]?.color||'gray'}" style="width:25px;height:25px;border-radius:6px">${icon(NodeTypes[n.type]?.icon||'code','sm')}</span>`).join('')}</div><div class="card-foot">${badge(w.active?'Veröffentlicht':'Entwurf',w.active?'green':'')}<span class="spacer"></span><span>${w.nodes.length} Schritte · ${w.runs.length} Tests</span></div></article>`).join('')}</div>${filterEmpty()}</div>`}
function renderWorkflow(){const w=store.workflows.find(x=>x.id===ui.id);if(!w)return empty('Workflow nicht gefunden','Öffne die Übersicht.',btn('Workflows','nav','workflow','','data-view="workflows"'));const selected=w.nodes.find(n=>n.id===ui.flowNode);return `<div class="workflow-stage"><div class="builder-toolbar">${ib('arrowLeft','nav','Zurück zu Workflows','data-view="workflows"')}<button class="grow truncate" style="text-align:left;font-weight:550" data-action="workflow-edit" data-id="${w.id}">${esc(w.name)}</button><span class="saved-indicator">${icon('check','sm')}Workspace gespeichert</span>${ib('history','flow-logs','Ausführungsverlauf')}${btn(w.active?'Bereitgestellt':'Bereitstellen','workflow-publish',w.active?'check':'share','sm',`data-id="${w.id}"`)}${btn(ui.flowExecution?'Stoppen':'Testen',ui.flowExecution?'flow-stop':'flow-run',ui.flowExecution?'stop':'play','primary sm',`data-id="${w.id}"`)}</div><div class="workflow-body"><div class="flow-grid"><div class="flow-content" id="flowContent" style="zoom:${ui.flowZoom}">${w.nodes.map((n,i)=>`<button class="flow-node ${ui.flowState[n.id]||''}" data-action="node-edit" data-id="${n.id}" id="node-${n.id}"><span class="node-number">${String(i+1).padStart(2,'0')}</span><div class="flex"><span class="icon-tile ${NodeTypes[n.type]?.color||'gray'}">${icon(NodeTypes[n.type]?.icon||'code','sm')}</span><span class="grow"><strong>${esc(n.name)}</strong><span class="muted" style="display:block;font-size:9px;margin-top:4px">${NodeTypes[n.type]?.name||n.type}</span></span>${icon(ui.flowState[n.id]==='done'?'check':'dots','sm')}</div><div class="node-summary">${esc(n.config||NodeTypes[n.type]?.description||'Konfigurieren').slice(0,130)}</div></button><div class="flow-connector"><span class="flow-add" data-action="node-add" data-index="${i+1}" role="button" tabindex="0" aria-label="Schritt hinzufügen">${icon('plus')}</span></div>`).join('')}<button class="btn" data-action="node-add" data-index="${w.nodes.length}">${icon('plus','sm')}Schritt hinzufügen</button></div><div class="flow-float">${ib('minus','flow-zoom-out','Verkleinern')}<span id="flowZoom">${Math.round(ui.flowZoom*100)} %</span>${ib('plus','flow-zoom-in','Vergrößern')}${ib('refresh','flow-zoom-reset','Ansicht zurücksetzen')}</div></div><aside class="flow-side"><div class="between" style="margin-bottom:17px"><h3>${ui.flowLogs?'Ausführungsverlauf':'Test & Details'}</h3>${badge('Lokal','purple')}</div>${ui.flowLogs?(w.runs.slice().reverse().map(r=>`<button class="flow-log full" data-action="flow-run-detail" data-id="${r.id}" style="text-align:left">${icon(r.status==='success'?'check':r.status==='stopped'?'stop':'info','sm')}<span><strong>${r.status==='success'?'Erfolgreich':r.status==='stopped'?'Gestoppt':r.status==='failed'?'Fehlgeschlagen':'Abgebrochen'}</strong><small>${dt(r.at,{dateStyle:'short',timeStyle:'short'})} · ${r.steps} Schritte</small></span></button>`).join('')||'<p class="muted small">Noch keine Tests ausgeführt.</p>'):`<p class="muted" style="font-size:11px;line-height:1.7">Wähle einen Schritt, um ihn zu bearbeiten. Im Test läuft der Prozess lokal durch; eine Freigabe wartet auf deine Entscheidung.</p><div class="menu-divider" style="margin:20px 0"></div><div class="field"><label for="flowInput">Testeingabe</label><textarea id="flowInput" rows="6" style="min-height:140px">${esc(w.nodes.find(n=>n.type==='trigger')?.config||'')}</textarea></div>${btn('Test starten','flow-run','play','full',`data-id="${w.id}" ${ui.flowExecution?'disabled':''}`)}<div id="flowRunPanel" style="margin-top:20px"></div><div style="margin-top:25px">${callout('KI-Schritte starten echte CLI-Prozesse. Freigaben, Abbruch und Protokolle findest du unter Läufe. HTTP-Actions sind nicht aktiviert.','info')}</div>`}</aside></div></div>`}
const SettingGroups=[['KONTO',[['profile','Profil','user'],['preferences','Darstellung & Präferenzen','settings'],['instructions','Eigene Anweisungen','pen'],['memory','Erinnerungen','brain'],['shared','Geteilte Chats','share'],['notifications','Benachrichtigungen','bell'],['account-security','Sitzungen','lock']]],['WORKSPACE',[['overview','Übersicht','layout'],['general','Allgemein','settings'],['members','Mitglieder','users'],['groups','Gruppen','users'],['roles','Rollen & Berechtigungen','shield'],['security','Sicherheit','lock'],['branding','Branding','pen'],['models','Modelle','brain']]],['PRODUKTE',[['chat','Chat','chat'],['agents','Agenten','agents'],['workflows','Workflows','workflow'],['integrations','Integrationen','integrations'],['api','API-Schlüssel','key'],['endpoint','Eigene KI verbinden','terminal'],['governance','Governance','shield']]],['VERWALTUNG',[['usage','Nutzung & Limits','chart'],['analytics','Analysen','chart'],['billing','Abrechnung','credit'],['audit','Audit-Log','history'],['data','Daten & Sicherung','download']]]];
function renderSettings(){const found=SettingGroups.flatMap(x=>x[1]).find(x=>x[0]===ui.setting);if(!found)ui.setting='profile';return `<div class="settings-layout"><nav class="settings-nav" aria-label="Einstellungen">${SettingGroups.map(([name,items])=>`<span class="section-label">${name}</span>${items.map(([id,label,ic])=>`<button class="nav-item ${ui.setting===id?'active':''}" data-action="setting-nav" data-id="${id}">${icon(ic,'sm')}${label}</button>`).join('')}`).join('')}</nav><section class="settings-content"><div class="settings-inner">${settingsBody()}</div></section></div>`}
function sHead(title,desc){return `<h1>${title}</h1><p class="muted">${desc}</p>`}
function preferenceSelect(group,key,values,val){return `<select data-change="setting" data-group="${group}" data-key="${key}" aria-label="${esc(key)}">${values.map(x=>{const [id,t]=Array.isArray(x)?x:[x,x];return `<option value="${id}" ${String(val)===String(id)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`}
function capabilityRows(items,group='capabilities'){return items.map(([key,label,desc])=>settingRow(label,desc,toggle(group,key,store[group][key],label))).join('')}
function localMetrics(){const all=store.chats.flatMap(c=>c.messages.filter(m=>m.role==='user'));return{messages:all.length,chats:store.chats.length,agents:store.agents.filter(a=>!a.archived).length,files:store.docs.length,runs:store.workflows.reduce((a,w)=>a+w.runs.length,0)}}
function analyticsBlock(){const m=localMetrics();const days=Array.from({length:7},(_,i)=>{let day=new Date();day.setDate(day.getDate()-(6-i));return {label:dt(day,{weekday:'short'}),count:store.chats.flatMap(c=>c.messages).filter(x=>x.role==='user'&&new Date(x.at).toDateString()===day.toDateString()).length}});const max=Math.max(1,...days.map(d=>d.count));return `<div class="stat-grid"><div class="stat"><label>Unterhaltungen</label><b>${m.chats}</b><small>Workspace gespeichert</small></div><div class="stat"><label>Nachrichten</label><b>${m.messages}</b><small>Inkl. Beispieldaten</small></div><div class="stat"><label>Agenten</label><b>${m.agents}</b><small>Im Workspace</small></div></div><div class="chart-card"><div class="between"><h3>Nachrichten im Zeitverlauf</h3>${badge('Letzte 7 Tage')}</div><div class="bar-chart">${days.map(d=>`<div class="bar-col"><small>${d.count}</small><div class="bar-fill" style="height:${Math.max(2,d.count/max*90)}%" title="${d.label}: ${d.count} Nachrichten"></div><span>${d.label}</span></div>`).join('')}</div></div><div class="settings-section"><h3>Modellauswahl in lokalen Chats</h3>${Models.filter(model=>store.chats.some(c=>c.model===model.id)).map(model=>{const count=store.chats.filter(c=>c.model===model.id).length;return `<div class="row-line"><div class="grow">${miniModel(model.id)}</div><div class="progress" style="width:25%"><span style="width:${count/Math.max(1,m.chats)*100}%"></span></div><span class="muted small">${count} Chats</span></div>`}).join('')}</div>`}
function settingsBody(){const p=store.profile,w=store.workspace;switch(ui.setting){case'profile':return sHead('Profil','Dein persönlicher Bereich in diesem Workspace.')+`<div class="flex" style="gap:17px;margin:27px 0">${avatar(p.fullName,'big',p.avatar)}<div>${btn('Bild ändern','avatar-upload','upload','sm')}<p class="muted" style="font-size:10px;margin-top:8px">PNG, JPG oder WebP · maximal 1 MB</p></div></div><form data-form="profile">${field('Vollständiger Name','fullName',p.fullName,'text','','required maxlength="100"')}${field('Wie sollen wir dich nennen?','name',p.name,'text','','required maxlength="50"')}${field('E-Mail-Adresse','email',p.email,'email','Lokales Profil. Die E-Mail dient nicht zur Anmeldung.','maxlength="150"')}${field('Rolle / Tätigkeit','job',p.job,'text','','maxlength="100"')}<div class="form-footer"><button class="btn primary" type="submit">Änderungen speichern</button></div></form><div class="settings-section"><h3>Workspace</h3>${settingRow(esc(w.name),'Du verwaltest diesen lokalen Arbeitsplatz.',badge('Admin','purple'))}</div>`;
case'preferences':return sHead('Darstellung & Präferenzen','Passe deinen Arbeitsplatz an deine Gewohnheiten an.')+`<h3>Darstellung</h3><div class="theme-options">${[['light','Hell'],['dark','Dunkel'],['system','System']].map(([id,t])=>`<button class="theme-card ${store.prefs.theme===id?'active':''}" data-action="theme" data-value="${id}"><div class="theme-preview ${id}"></div><div class="between"><span>${t}</span>${store.prefs.theme===id?icon('check','sm'):''}</div></button>`).join('')}</div>${settingRow('Kompakte Darstellung','Weniger Abstand in Navigation, Listen und Karten.',toggle('prefs','compact',store.prefs.compact,'Kompakte Darstellung'))}${settingRow('Animationen','Sanfte Übergänge in der Oberfläche.',toggle('prefs','motion',store.prefs.motion,'Animationen'))}${settingRow('Standardsprache','Die Oberfläche dieses Prototyps ist auf Deutsch verfügbar.',badge('Deutsch'))}${settingRow('Standardmodell','Wird für neue Chats vorausgewählt. Modelle sind Demo-Auswahlprofile.',preferenceSelect('prefs','defaultModel',Models.filter(m=>m.id==='auto'||live.runners.some(r=>r.id===m.id&&r.enabled&&r.available)).map(m=>[m.id,m.name]),store.prefs.defaultModel))}${settingRow('Mit Enter senden','Shift + Enter fügt weiterhin einen Zeilenumbruch ein.',toggle('prefs','enterSend',store.prefs.enterSend,'Mit Enter senden'))}<div class="settings-section"><h3>Chat-Präferenzen</h3>${capabilityRows([['web','Websuche','Im Chat anbieten, sofern vom Workspace freigegeben.'],['images','Bilderstellung','Funktion als Demo-Vorschau verfügbar machen.'],['memory','Erinnerungen','Gespeicherte persönliche Hinweise in regulären API-Chats verwenden.'],['autoActions','Integrationen automatisch finden','Gespeicherte Präferenz. Kein automatischer Tool-Aufruf.']],'prefs')}</div>`;
case'instructions':return sHead('Eigene Anweisungen','Gib regulären Chats deinen Kontext und deinen bevorzugten Stil.')+settingRow('Anweisungen aktiv','Gilt nicht für Agenten und Projekte mit eigenen Anweisungen.',toggle('prefs','customActive',store.prefs.customActive,'Eigene Anweisungen aktiv'))+`<form data-form="instructions" style="margin-top:24px">${field('Was sollte die KI über dich wissen?','about',store.prefs.about,'textarea','','maxlength="6000" style="min-height:130px"')}${field('Wie soll die KI antworten?','instructions',store.prefs.instructions,'textarea','','maxlength="10000" style="min-height:150px"')}<div class="form-footer"><button class="btn primary" type="submit">Speichern</button></div></form>${callout('Im API-Modus werden diese Anweisungen mitgesendet. Die lokale Demo ist kein Sprachmodell und befolgt freie Anweisungen nicht vollständig.','info')}`;
case'memory':return sHead('Erinnerungen','Persönlicher Kontext, den du selbst kontrollierst.')+settingRow('Erinnerungen verwenden','Wird in regulären API-Chats berücksichtigt, nicht in Agenten oder Projekten.',toggle('prefs','memory',store.prefs.memory,'Erinnerungen verwenden'))+`<div class="between" style="margin:23px 0 12px"><h3>Gespeicherte Hinweise</h3>${btn('Hinzufügen','memory-create','plus','sm')}</div>${store.memories.map(m=>`<div class="row-line"><div class="grow" style="font-size:12px;line-height:1.7">${esc(m.text)}</div>${ib('edit','memory-edit','Erinnerung bearbeiten',`data-id="${m.id}"`)}${ib('trash','memory-delete','Erinnerung löschen',`data-id="${m.id}"`)}</div>`).join('')||empty('Keine Erinnerungen','Du entscheidest, welche Hinweise gespeichert werden.','','brain')}<div style="margin-top:24px">${btn('Alle Erinnerungen löschen','memory-clear','trash','danger sm')}</div>`;
case'shared':{const shared=store.chats.filter(c=>c.shared);return sHead('Geteilte Chats','Workspace gespeicherte Freigaben und exportierbare Gesprächskopien.')+callout('Es gibt in dieser Datei keine öffentlichen Links. Eine Freigabe lässt sich als eigenständige HTML-Lesekopie exportieren. Bereits exportierte Kopien können nicht zurückgerufen werden.','share')+shared.map(c=>`<div class="row-line"><div class="grow"><strong style="font-size:12px">${esc(c.title)}</strong><p>Lokale Freigabe · ${dt(c.updated)}</p></div>${btn('Exportieren','chat-share-export','download','sm',`data-id="${c.id}"`)}${ib('close','chat-unshare','Lokale Freigabe aufheben',`data-id="${c.id}"`)}</div>`).join('')+(!shared.length?empty('Noch keine geteilten Chats','Öffne einen Chat und wähle „Teilen“.','','share'):'')}
case'notifications':return sHead('Benachrichtigungen','Lege fest, welche Hinweise die Oberfläche anzeigen soll.')+capabilityRows([['notify','Hinweise im Browser','UI-Bestätigungen für Aktionen. Keine Push-Nachrichten im Hintergrund.'],['updates','Produkt-Updates','Lokale Präferenz; es wird kein Newsletter abonniert.']],'prefs')+settingRow('Geplante Aufgaben','Zeitpläne lassen sich konfigurieren, werden aber nicht im Hintergrund ausgeführt.',btn('Verwalten','nav','clock','sm','data-view="tasks"'));
case'account-security':return sHead('Sitzungen','Informationen zu dieser lokalen Anwendung.')+callout('Dieser Prototyp hat keine Anmeldung. Browserdaten sind lokal und nicht verschlüsselt. Verwende hier keine vertraulichen Unternehmensdaten oder produktiven Zugangsdaten.','shield','warning')+`<div class="row-line" style="margin-top:20px"><div class="icon-tile gray">${icon('terminal')}</div><div class="grow"><strong style="font-size:12px">Dieser Browser</strong><p>${esc(navigator.platform||'Lokales Gerät')} · ${endpoint.enabled?'API-Endpunkt eingerichtet':'Offline-Demo'}</p></div>${badge('Aktuell','green')}</div>${settingRow('API-Sitzung beenden','Entfernt den nur im Arbeitsspeicher gehaltenen Schlüssel.',btn('Verbindung trennen','endpoint-disconnect','logout','sm'))}${settingRow('Lokale Daten sichern','Exportiere deinen Stand vor einem Gerätewechsel.',btn('Exportieren','data-export','download','sm'))}`;
case'overview':return sHead('Workspace-Übersicht','Dein KI-Arbeitsplatz auf einen Blick.')+`<div class="feature-band"><div class="icon-tile">${icon('layout','lg')}</div><div><h3>${esc(w.name)}</h3><p>${esc(w.description)}</p></div>${badge('Lokale Demo','purple')}</div>`+analyticsBlock()+`<div class="settings-section"><h3>Produkte</h3>${[['chat','Chat','chat'],['agents','Agenten','agents'],['workflows','Workflows','workflow'],['integrations','Integrationen','integrations']].map(([id,n,ic])=>`<div class="row-line">${icon(ic)}<strong class="grow" style="font-size:12px">${n}</strong>${badge('Demo verfügbar','green')}${ib('chevron','setting-nav','Einstellungen öffnen',`data-id="${id}"`)}</div>`).join('')}</div>`;

// Modal and menu infrastructure, focus management, keyboard escape, safe form handling.
function modal(title,body,footer='',wide=false,context={}){closePopover();ui.lastFocus=document.activeElement;modalContext=context;$('#main').inert=true;$('#sidebar').inert=true;$('#modalHost').innerHTML=`<div class="overlay" data-action="overlay-close"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-header"><h2 id="modalTitle">${title}</h2>${ib('close','modal-close','Dialog schließen')}</header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;setTimeout(()=>$('#modalHost input:not([type=checkbox]),#modalHost textarea,#modalHost select,#modalHost button')?.focus(),30)}
function closeModal(){if(!$('#modalHost').innerHTML)return;$('#modalHost').innerHTML='';$('#main').inert=false;$('#sidebar').inert=false;stopVoice();ui.lastFocus?.isConnected&&ui.lastFocus.focus?.();modalContext={}}
function formModal(title,formName,body,submit='Speichern',wide=false,ctx={}){modal(title,`<form data-form="${formName}" id="modalForm">${body}<div class="form-footer">${btn('Abbrechen','modal-close')}<button class="btn primary" type="submit">${submit}</button></div></form>`,'',wide,ctx)}
function confirmAction(title,body,fn,label='Löschen'){pendingConfirm=fn;modal(title,`<p style="font-size:12px;line-height:1.8">${esc(body)}</p>`,btn('Abbrechen','modal-close')+btn(label,'confirm','','danger'));}
function popover(anchor,html,wide=false,up=false){closePopover();let r=anchor?.getBoundingClientRect?.()||{left:20,bottom:70,top:70,right:300};const width=wide?337:244;let left=Math.min(Math.max(10,r.left),window.innerWidth-width-10);$('#popoverHost').innerHTML=`<div class="popover-shade" data-action="popover-close"></div><div class="popover ${wide?'wide':''}" role="menu" style="left:${Math.max(10,left)}px;top:10px">${html}</div>`;const el=$('.popover');const h=el.getBoundingClientRect().height;let top=(up||r.bottom+h+10>window.innerHeight)?Math.max(10,r.top-h-6):r.bottom+7;el.style.top=Math.min(top,Math.max(10,window.innerHeight-h-10))+'px';setTimeout(()=>el.querySelector('input,button')?.focus(),20)}
function closePopover(){$('#popoverHost').innerHTML=''}
function menuItem(label,action,ic,extra='',cls='',sub=''){return `<button class="menu-item ${cls}" data-action="${action}" ${extra}>${icon(ic,'sm')}<span class="grow">${label}${sub?`<small>${sub}</small>`:''}</span></button>`}

function csvRows(text){const sep=text.split('\n')[0]?.includes(';')?';':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(cell);cell=''}else if(c==='\n'&&!quoted){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()))}

async function processFiles(files){if(!store.capabilities.files){toast('Dateifunktionen sind im Workspace deaktiviert.',true);return}let added=[];let used=new Blob([JSON.stringify(store)]).size;for(const f of Array.from(files).slice(0,15)){if(f.size>3000000){toast(f.name+': größer als 3 MB. Nicht importiert.',true);continue}try{let d={id:uid('d'),name:f.name.slice(0,150),type:f.type,size:f.size,folder:ui.uploadTarget==='library'?ui.folder:null,created:Date.now(),kind:'metadata'};if(/\.(txt|md|csv|json|log)$/i.test(f.name)||f.type.startsWith('text/')&&!/svg/.test(f.type)){d.text=await f.text();d.kind='text'}else if(['image/png','image/jpeg','image/webp'].includes(f.type)){d.data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});d.kind='image'}if(used+JSON.stringify(d).length>3900000){toast('Lokales Speicherlimit erreicht. Sichere oder entferne Dateien.',true);continue}used+=JSON.stringify(d).length;store.docs.push(d);added.push(d.id);store.usage.files++;if(d.kind==='metadata')toast(f.name+': nur Metadaten gespeichert; kein Parser.',true)}catch(e){toast(f.name+': Lesen fehlgeschlagen.',true)}}if(added.length){if(ui.uploadTarget==='chat')ui.attachments=[...new Set([...ui.attachments,...added])];log('Dateien hochgeladen',added.length+' Datei(en) lokal gespeichert.');render();toast(added.length+' Datei(en) hinzugefügt.')}$('#uploadInput').value=''}

function inferAgentDraft(text){const a=ui.editAgent||{};const l=text.toLowerCase(),changes=[];const add=(arr,v)=>{if(!arr.includes(v))arr.push(v)};a.capabilities=[...(a.capabilities||[])];a.integrations=[...(a.integrations||[])];if(!a.name){if(/jira/.test(l)&&/(mail|email|postfach|inbox)/.test(l))a.name='Inbox → Jira';else if(/meeting|protokoll/.test(l))a.name='Meeting-Assistent';else if(/sales|lead|crm/.test(l))a.name='Sales-Assistent';else if(/support|help.?desk|ticket/.test(l))a.name='Support-Assistent';else if(/daten|analyse|csv|excel/.test(l))a.name='Datenanalyst';else a.name='Arbeitsassistent';changes.push('Name')}

if(store.models['gpt-5.6-terra'])a.model='gpt-5.6-terra';
add(a.capabilities,'files');if(/wissen|dokument|handbuch|knowledge|richtlinie/.test(l))add(a.capabilities,'knowledge');if(/web|recherch|internet|suche/.test(l))add(a.capabilities,'web');if(/bild|image|foto/.test(l))add(a.capabilities,'images');if(/canvas|dokument erstellen|bericht/.test(l))add(a.capabilities,'canvas');
const imap={jira:'jira',gmail:'gmail',outlook:'outlook',slack:'slack',notion:'notion',drive:'gdrive',kalender:'calendar',calendar:'calendar',teams:'teams',salesforce:'salesforce',hubspot:'hubspot',github:'github',confluence:'confluence'};for(const[k,v]of Object.entries(imap))if(l.includes(k))add(a.integrations,v);

function demoAnswer(prompt,files=[],a=null,tools=ui.tools){const readable=files.filter(d=>d.kind==='text'&&d.text);const csv=readable.find(d=>/\.csv$/i.test(d.name));const lower=prompt.toLowerCase();if(csv&&/daten|analys|umsatz|trend|zahl|summe/.test(lower)){const rows=csvRows(csv.text);const headers=rows[0]||[];let sums=headers.map((h,j)=>j?rows.slice(1).reduce((s,r)=>{const val=Number((r[j]||'').trim().replace(',','.'));return s+(Number.isFinite(val)?val:0)},0):0);return {text:`## Auswertung von ${csv.name}\n\nDie Berechnung basiert auf der lokal gelesenen CSV-Datei mit **${rows.length-1} Datenzeilen**.\n\n${headers.slice(1).map((h,i)=>`- **${h}:** ${num(sums[i+1])}`).join('\n')}\n\n**Summe aller numerischen Spalten: ${num(sums.reduce((a,b)=>a+b,0))}**\n\nDas ist eine direkte lokale Berechnung, keine KI-Interpretation. Leere oder nicht numerische Zellen zählen als 0; Dezimaltrennzeichen Komma und Punkt werden unterstützt.`,sources:[csv.id]}}
if(readable.length){const tokens=lower.split(/[^a-zäöüß0-9]+/).filter(t=>t.length>3);let excerpts=readable.map(d=>{let paras=d.text.split(/\n\n+/).filter(s=>s.trim());let scored=paras.map((s,i)=>({s,i,score:tokens.reduce((n,t)=>n+(s.toLowerCase().includes(t)?1:0),0)})).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,4);return `### ${d.name}\n\n${scored.map(x=>x.s.replace(/^#+\s*/gm,'').slice(0,650)).join('\n\n')}`}).slice(0,3);return {text:`## Passende Auszüge aus deinen Dokumenten\n\n${excerpts.join('\n\n')}\n\n*Lokal nach Schlüsselwörtern ausgewählte Originalauszüge. Dies ist keine KI-generierte Zusammenfassung. ${a?'Agent: '+a.name+'.':''}*`,sources:readable.slice(0,3).map(d=>d.id)}}
if(files.some(d=>d.kind==='metadata'))return{text:'## Der Dateiinhalt ist nicht verfügbar\n\nIn dieser Demo wurde für die angehängte PDF-/Office-Datei nur der Dateiname gespeichert. Ich kann ihren Inhalt nicht lesen oder zuverlässig zusammenfassen.\n\nFüge den Text in den Chat ein oder lade eine TXT-, Markdown-, CSV- oder JSON-Datei hoch.',sources:[]};
if(files.some(d=>d.kind==='image'))return{text:'## Bild lokal angehängt\n\nDas Bild kann in der Dateivorschau angezeigt werden. Die lokale Demo verfügt über kein Bildverständnis und beschreibt den Inhalt deshalb nicht.\n\nDer optionale API-Modus unterstützt hier nur Textnachrichten, keine Bildanalyse.',sources:files.filter(d=>d.kind==='image').map(d=>d.id)};
if(tools.web||tools.research)return{text:`## ${tools.research?'Rechercheplan':'Websuche vorbereiten'}\n\n**Thema:** ${prompt}\n\n1. Fragestellung eingrenzen und Begriffe festlegen.\n2. Primärquellen zu den entscheidenden Punkten suchen.\n3. Aussagen mit Datum und Belegen vergleichen.\n4. Ergebnisse und offene Fragen getrennt festhalten.\n\n**Keine Internetrecherche ausgeführt.** Für echte Suchergebnisse braucht diese Datei einen angebundenen Suchdienst. Es werden keine erfundenen Quellen angezeigt.`,sources:[]};
if(/e-mail|email|nachricht|kundenkommunikation/.test(lower))return{text:`## Ein Entwurf für deine Nachricht\n\n**Dein Auftrag:** ${prompt}\n\n**Betreff:** Nächste Schritte zu unserem Gespräch\n\nHallo [Name],\n\nvielen Dank für deine Nachricht. Gerne nehmen wir uns deines Anliegens an.\n\nWir prüfen die offenen Punkte und melden uns bis [Datum] mit einem konkreten Vorschlag. Falls du uns noch Unterlagen schicken möchtest, antworte direkt auf diese Nachricht.\n\nVielen Dank und beste Grüße\n${store.profile.name}\n\n---\n*Lokale Textvorlage. Ersetze die Platzhalter und passe Inhalt und Ton an deinen Auftrag an. Für eine individuell erzeugte Antwort verbinde einen KI-Endpunkt.*`,sources:[]};
if(/idee|brainstorm|workshop|plan/.test(lower))return{text:`## Drei Richtungen für deinen nächsten Schritt\n\n**Ausgangspunkt:** ${prompt}\n\n### 1. Klein anfangen\nWähle einen klar abgegrenzten Anwendungsfall und teste ihn mit einer Person. Halte Aufwand und Ergebnis fest.\n\n### 2. Gemeinsam entwickeln\nSammle Perspektiven aus dem Team. Formuliere daraus eine gemeinsame Hypothese und einen überprüfbaren nächsten Schritt.\n\n### 3. Wissen wiederverwendbar machen\nDokumentiere, was funktioniert. Speichere einen Prompt oder erstelle einen Agenten, damit andere darauf aufbauen können.\n\n**Nächster Schritt:** Ziel, Verantwortliche und Termin festlegen.\n\n*Vorbereitete lokale Beispielantwort, keine Antwort des ausgewählten KI-Modells.*`,sources:[]};
return {text:`## Deine Aufgabe ist angekommen\n\n> ${prompt.slice(0,3000)}\n\n${a?`**Agent:** ${a.name}\n**Konfiguration:** ${a.instructions.slice(0,450)}\n\n`:''}Diese Datei ist eine lokale, interaktive Produktdemo und enthält kein Sprachmodell. Sie kann Textdateien durchsuchen, CSV-Daten berechnen und Beispielvorlagen ausgeben. Freie Fragen werden ohne angebundenes Modell nicht inhaltlich beantwortet.\n\n**Direkt ausprobieren:** Hänge „Team-Handbuch.md“ an und frage nach dem Team-Meeting, oder wähle „Umsatz-Beispiel.csv“ für eine echte lokale Berechnung.\n\nUnter **Einstellungen → Eigene KI verbinden** kannst du einen kompatiblen Endpunkt für echte Antworten konfigurieren.`,sources:[]}}

const result=demoAnswer(last?.text||'',contextFiles,a);m.files=(c.agent&&!store.capabilities.agentSources)?[]:result.sources;let pos=0;run.timer=setInterval(()=>{if(run.cancelled){clearInterval(run.timer);return}pos=Math.min(pos+32,result.text.length);m.text=result.text.slice(0,pos);const el=$('#text-'+m.id);if(el){el.innerHTML=formatText(m.text);scrollChat()}if(pos>=result.text.length)finishGeneration(run)},17)}
function finishGeneration(run){clearInterval(run.timer);const c=store.chats.find(x=>x.id===run.chat);if(c)c.updated=Date.now();if(ui.busy===run)ui.busy=null;save();if(ui.view==='chat'){$('#view').innerHTML=renderChat();restoreComposer();scrollChat()}renderSidebar();}

async function startFlow(){if(ui.flowExecution)return;if(!store.capabilities.workflows){toast('Workflows sind im Workspace deaktiviert.',true);return}const w=store.workflows.find(x=>x.id===ui.id);if(!w)return;if(!w.nodes.length||w.nodes[0].type!=='trigger'){toast('Der erste Schritt muss ein Start-Schritt sein.',true);return}const value=$('#flowInput')?.value||w.nodes[0].config||'';ui.flowState={};flowAbort=false;ui.flowExecution={id:uid('run'),workflow:w.id,at:Date.now(),nodes:clone(w.nodes),index:0,value,logs:[],waiting:false,steps:0,status:'running'};ui.flowLogs=false;render();await continueFlow()}

async function continueFlow(){const ex=ui.flowExecution;if(!ex)return;try{while(ex.index<ex.nodes.length){if(flowAbort||ui.flowExecution!==ex)return;const n=ex.nodes[ex.index];ui.flowState[n.id]='running';updateFlowPanel();await delay(280);if(flowAbort||ui.flowExecution!==ex)return;switch(n.type){case'trigger':flowLog('Eingabe übernommen ('+ex.value.length+' Zeichen)');break;case'ai':ex.value='## Lokale Beispiel-Zusammenfassung\n\n'+ex.value.split(/\n|(?<=[.!?])\s+/).filter(Boolean).map(s=>'- '+s.trim()).join('\n')+'\n\nAnweisung: '+n.config+'\n\nHinweis: Strukturierung per lokalem Textalgorithmus, keine KI-Ausführung.';flowLog('Text strukturiert · Demo-KI-Schritt');break;case'transform':if(/groß/i.test(n.config))ex.value=ex.value.toLocaleUpperCase('de');else if(/klein/i.test(n.config))ex.value=ex.value.toLocaleLowerCase('de');else ex.value=ex.value.split(/\n|(?<=[.!?])\s+/).filter(Boolean).map((s,i)=>(i+1)+'. '+s.trim()).join('\n');flowLog('Texttransformation ausgeführt');break;case'condition':if(!ex.value.toLowerCase().includes(n.config.toLowerCase()))throw Error('Bedingung nicht erfüllt: „'+n.config+'“ ist nicht enthalten.');flowLog('Bedingung erfüllt');break;case'approval':ex.waiting=true;ui.flowState[n.id]='waiting';flowLog('Wartet auf deine Freigabe','waiting');return;case'output':const doc={id:uid('d'),name:(n.config||'Workflow-Ergebnis').replace(/\.md$/,'')+'.md',text:ex.value,type:'text/markdown',kind:'text',size:new Blob([ex.value]).size,folder:null,created:Date.now()};store.docs.push(doc);ex.output=doc.id;save();flowLog('Dokument in Bibliothek gespeichert');break;case'http':throw Error('HTTP-Schritte benötigen einen Backend-Adapter. Es wurde keine Anfrage ausgeführt.');default:throw Error('Unbekannter Schritttyp.')}ui.flowState[n.id]='done';ex.steps++;ex.index++;updateFlowPanel()}finishFlow('success')}catch(e){flowLog(e.message,'error');finishFlow('failed',e.message)}}
function finishFlow(status,reason=''){const ex=ui.flowExecution;if(!ex)return;const w=store.workflows.find(x=>x.id===ex.workflow);ex.status=status;ex.reason=reason;if(w)w.runs.push(clone(ex));ui.flowExecution=null;log('Workflow-Test '+(status==='success'?'abgeschlossen':status),w?.name||'');if(ui.view==='workflow'){render();const el=$('#flowRunPanel');if(el)el.innerHTML=`${callout(status==='success'?'Test erfolgreich abgeschlossen.':status==='stopped'?'Test gestoppt.':status==='rejected'?'Freigabe abgelehnt. Es wurde keine Ausgabe gespeichert.':esc(reason),status==='success'?'check':'info',status==='success'?'purple':'warning')}${ex.output?`<div style="margin-top:12px">${btn('Ergebnis öffnen','doc-open','file','sm full',`data-id="${ex.output}"`)}</div>`:''}`}toast(status==='success'?'Workflow erfolgreich getestet.':status==='failed'?'Workflow gestoppt: '+reason:'Workflow-Test beendet.',status==='failed')}
function stopFlow(){if(!ui.flowExecution)return;flowAbort=true;finishFlow('stopped')}
function approveFlow(approved){const ex=ui.flowExecution;if(!ex?.waiting)return;if(!approved){finishFlow('rejected');return}ex.waiting=false;const n=ex.nodes[ex.index];ui.flowState[n.id]='done';ex.steps++;ex.index++;flowLog('Freigabe erteilt');continueFlow()}
function workflowRunDetail(id){const w=store.workflows.find(x=>x.id===ui.id);const r=w?.runs.find(x=>x.id===id);if(!r)return;modal('Testlauf · '+esc(w.name),`<div class="between" style="margin-bottom:17px">${badge(r.status,r.status==='success'?'green':'amber')}<span class="muted small">${dt(r.at,{dateStyle:'short',timeStyle:'short'})}</span></div>${r.logs.map(l=>`<div class="flow-log">${icon(l.status==='error'?'info':'check','sm')}${esc(l.text)}</div>`).join('')}<h3 style="margin:20px 0 12px">Ergebnis</h3><div class="file-preview">${esc(r.value)}</div>`,btn('Schließen','modal-close')+btn('JSON exportieren','flow-run-export','download','',`data-id="${id}"`),true)}
function openVoice(){modal('Spracheingabe',`<div style="text-align:center"><div class="voice-orb"></div><h3 id="voiceStatus">Bereit zum Diktieren</h3><p class="muted" style="font-size:12px;margin:10px 0 20px">Die Spracherkennung kommt vom Browser und kann je nach Browser einen externen Dienst verwenden. Sie startet erst mit deiner Zustimmung.</p><textarea class="input" id="voiceText" aria-label="Diktierter Text" placeholder="Dein Text erscheint hier …" style="min-height:100px"></textarea><p class="muted" style="font-size:10px;margin-top:12px">Nicht in jedem Browser verfügbar. Tippen ist jederzeit möglich.</p></div>`,btn('Starten','voice-start','mic')+btn('In Chat übernehmen','voice-accept','check','primary'))}
